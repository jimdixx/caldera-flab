- tactic: collection
  technique_name: Data from Local System
  technique_id: T1005
  name: Find IP Addresses (Linux)
  description: Greps IP addresses and assignes them to host.user.name for a further
    enumeration
  executors:
  - name: sh
    platform: linux
    command: ip -o -4 addr show scope global | awk '!($2 ~ /^(lo|docker0|br-|veth|enx344b50000000|wg0)/){print
      $4}'
    code: null
    language: null
    build_target: null
    payloads: []
    uploads: []
    timeout: 60
    parsers:
    - module: plugins.stockpile.app.parsers.basic
      parserconfigs:
      - source: host.collected.ip
        edge: ''
        target: ''
        custom_parser_vals: {}
    cleanup: []
    variations: []
    additional_info: {}
  requirements: []
  privilege: ''
  repeatable: false
  buckets:
  - collection
  additional_info: {}
  access: {}
  singleton: true
  plugin: ''
  delete_payload: true
  id: c4e71c04-80b0-434d-ac5a-c0c12236e359
